name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the leading v), e.g. 0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Tag pushes use the tag name, manual runs the given version.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig and cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild --locked
      # Linking against glibc 2.28 keeps the binary compatible with practically every
      # distribution released since 2018 (Debian 10, Ubuntu 18.10, RHEL/Alma/Rocky 8, ...).
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28
      - name: Package tarball
        run: |
          VERSION=${VERSION#v}
          DIR=vigil-$VERSION-linux-${{ matrix.arch }}
          mkdir -p $DIR/icons
          cp target/${{ matrix.target }}/release/vigil $DIR/
          cp packaging/linux/install.sh packaging/linux/*.desktop packaging/linux/*.metainfo.xml LICENSE README.md $DIR/
          cp assets/*.svg assets/vigil-*.png $DIR/icons/
          tar czf $DIR.tar.gz $DIR
      - name: Build .deb and .rpm
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/vigil target/release/vigil
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output .
          cargo generate-rpm --target ${{ matrix.target }} --output .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.deb
            *.rpm

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package zip
        shell: pwsh
        run: |
          $version = "$env:VERSION".TrimStart("v")
          $dir = "vigil-$version-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/vigil.exe, LICENSE, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: Build installer
        shell: pwsh
        run: |
          $version = "$env:VERSION".TrimStart("v")
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                                "C:\Program Files\Inno Setup 6\ISCC.exe" `
                                -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Select-Object -First 1
          }
          Copy-Item target/release/vigil.exe packaging/windows/vigil.exe
          & $iscc.FullName "/DAppVersion=$version" "packaging/windows/vigil.iss"
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
          Copy-Item "packaging/windows/VigilSetup-$version.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            *.zip
            VigilSetup-*.exe

  publish:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz *.deb *.rpm *.zip VigilSetup-*.exe > SHA256SUMS.txt
      - name: Release tag and notes
        run: |
          V="${VERSION#v}"
          echo "TAG=v$V" >> "$GITHUB_ENV"
          # Release notes: only this version's section of the changelog, plus the download table.
          awk -v h="## [$V]" 'index($0, h) == 1 {f = 1; next} f && /^## \[/ {exit} f' src/CHANGELOG.md > NOTES.md
          test -s NOTES.md || { echo "CHANGELOG.md has no section for $V"; exit 1; }
          cat >> NOTES.md <<'EOF'

          ## Downloads

          | System | File |
          |---|---|
          | Windows 10 / 11 | `VigilSetup-*.exe` (installer) or `vigil-*-windows-x86_64.zip` (portable) |
          | Debian, Ubuntu | `vigil-task-manager_*_amd64.deb` (ARM: `_arm64.deb`) |
          | Fedora, RHEL, openSUSE | `vigil-task-manager-*.x86_64.rpm` (ARM: `.aarch64.rpm`) |
          | Other Linux | `vigil-*-linux-x86_64.tar.gz`, then `./install.sh` |

          Linux binaries require glibc 2.28 or newer. Checksums: `SHA256SUMS.txt`.
          EOF
      # Creates the tag (if needed) at the built commit and uploads all artifacts.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Vigil Task Manager ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: NOTES.md
          files: |
            VigilSetup-*.exe
            *.tar.gz
            *.deb
            *.rpm
            *.zip
            SHA256SUMS.txt
