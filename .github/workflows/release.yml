name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig and cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild --locked
      # Linking against glibc 2.28 keeps the binary compatible with practically every
      # distribution released since 2018 (Debian 10, Ubuntu 18.10, RHEL/Alma/Rocky 8, ...).
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28
      - name: Package tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DIR=vigil-$VERSION-linux-${{ matrix.arch }}
          mkdir -p $DIR/icons
          cp target/${{ matrix.target }}/release/vigil $DIR/
          cp packaging/linux/install.sh packaging/linux/*.desktop packaging/linux/*.metainfo.xml LICENSE README.md $DIR/
          cp assets/*.svg assets/vigil-*.png $DIR/icons/
          tar czf $DIR.tar.gz $DIR
      - name: Build .deb and .rpm
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/vigil target/release/vigil
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output .
          cargo generate-rpm --target ${{ matrix.target }} --output .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.deb
            *.rpm

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package zip
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $dir = "vigil-$version-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/vigil.exe, LICENSE, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: "*.zip"

  publish:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz *.deb *.rpm *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.deb
            *.rpm
            *.zip
            SHA256SUMS.txt
