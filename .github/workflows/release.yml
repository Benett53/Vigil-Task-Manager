name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the leading v), e.g. 0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Tag pushes use the tag name, manual runs the given version.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig and cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild --locked
      # Linking against glibc 2.28 keeps the binary compatible with practically every
      # distribution released since 2018 (Debian 10, Ubuntu 18.10, RHEL/Alma/Rocky 8, ...).
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28
      - name: Package tarball
        run: |
          VERSION=${VERSION#v}
          DIR=vigil-$VERSION-linux-${{ matrix.arch }}
          mkdir -p $DIR/icons
          cp target/${{ matrix.target }}/release/vigil $DIR/
          cp packaging/linux/install.sh packaging/linux/*.desktop packaging/linux/*.metainfo.xml LICENSE README.md $DIR/
          cp assets/*.svg assets/vigil-*.png $DIR/icons/
          tar czf $DIR.tar.gz $DIR
      - name: Build .deb and .rpm
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/vigil target/release/vigil
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output .
          cargo generate-rpm --target ${{ matrix.target }} --output .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.deb
            *.rpm

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package zip
        shell: pwsh
        run: |
          $version = "$env:VERSION".TrimStart("v")
          $dir = "vigil-$version-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/vigil.exe, LICENSE, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: "*.zip"

  publish:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz *.deb *.rpm *.zip > SHA256SUMS.txt
      - name: Release tag
        run: |
          V="${VERSION#v}"
          echo "TAG=v$V" >> "$GITHUB_ENV"
      # Creates the tag (if needed) at the built commit and uploads all artifacts.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Vigil Task Manager ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ## Downloads

            | System | File |
            |---|---|
            | Debian, Ubuntu, Mint, Pop!_OS, ... | `vigil-task-manager_*_amd64.deb` (ARM: `_arm64.deb`) → `sudo apt install ./vigil-task-manager_*.deb` |
            | Fedora, RHEL, openSUSE, ... | `vigil-task-manager-*.x86_64.rpm` (ARM: `.aarch64.rpm`) → `sudo dnf install ./vigil-task-manager-*.rpm` |
            | Any Linux distribution | `vigil-*-linux-x86_64.tar.gz` → extract, run `./vigil` directly or `./install.sh` |
            | Windows 10 / 11 | `vigil-*-windows-x86_64.zip` → extract and run `vigil.exe` |

            Linux binaries require glibc 2.28 or newer. Verify downloads with `SHA256SUMS.txt`.
          files: |
            *.tar.gz
            *.deb
            *.rpm
            *.zip
            SHA256SUMS.txt
