[package]
name = "vigil"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Fast, free and open source task manager for Linux and Windows, in the style of the Windows Task Manager"
license = "GPL-3.0-or-later"
repository = "https://github.com/baba537/Vigil-Task-Manager"
homepage = "https://github.com/baba537/Vigil-Task-Manager"
readme = "README.md"
keywords = ["task-manager", "system-monitor", "process", "linux", "gui"]
categories = ["command-line-utilities", "gui", "os"]
build = "build.rs"
exclude = ["/.github", "/docs/screenshots"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "persistence", "accesskit"] }
egui = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", default-features = false }
serde = { version = "1", features = ["derive"] }
nvml-wrapper = { version = "0.13", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = ["nvidia"]
# Runtime-loaded NVIDIA NVML support (no build- or run-time requirement when absent).
nvidia = ["dep:nvml-wrapper"]

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "user"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_Time",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[build-dependencies]
winresource = "0.1"

# `cargo deb` (https://github.com/kornelski/cargo-deb)
[package.metadata.deb]
name = "vigil-task-manager"
maintainer = "Vigil contributors"
copyright = "Vigil contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
Vigil is a fast, free and open source task manager in the style of the Windows \
Task Manager: processes grouped into apps, performance graphs for CPU, memory, \
disks, network and GPUs, app history, startup apps, users, details and services."""
section = "utils"
priority = "optional"
depends = "libc6 (>= 2.28), libxkbcommon-x11-0, libgl1 | libgles2, libegl1"
recommends = "pkexec | policykit-1, hwdata, libwayland-client0, libxkbcommon0"
assets = [
    ["target/release/vigil", "usr/bin/", "755"],
    ["packaging/linux/io.github.baba537.Vigil.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/io.github.baba537.Vigil.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/io.github.baba537.Vigil.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/vigil-32.png", "usr/share/icons/hicolor/32x32/apps/io.github.baba537.Vigil.png", "644"],
    ["assets/vigil-48.png", "usr/share/icons/hicolor/48x48/apps/io.github.baba537.Vigil.png", "644"],
    ["assets/vigil-64.png", "usr/share/icons/hicolor/64x64/apps/io.github.baba537.Vigil.png", "644"],
    ["assets/vigil-128.png", "usr/share/icons/hicolor/128x128/apps/io.github.baba537.Vigil.png", "644"],
    ["assets/vigil-256.png", "usr/share/icons/hicolor/256x256/apps/io.github.baba537.Vigil.png", "644"],
]

# `cargo generate-rpm` (https://github.com/cat-in-136/cargo-generate-rpm)
[package.metadata.generate-rpm]
name = "vigil-task-manager"
assets = [
    { source = "target/release/vigil", dest = "/usr/bin/vigil", mode = "755" },
    { source = "packaging/linux/io.github.baba537.Vigil.desktop", dest = "/usr/share/applications/io.github.baba537.Vigil.desktop", mode = "644" },
    { source = "packaging/linux/io.github.baba537.Vigil.metainfo.xml", dest = "/usr/share/metainfo/io.github.baba537.Vigil.metainfo.xml", mode = "644" },
    { source = "assets/io.github.baba537.Vigil.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.baba537.Vigil.svg", mode = "644" },
    { source = "assets/vigil-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.baba537.Vigil.png", mode = "644" },
    { source = "assets/vigil-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.baba537.Vigil.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/vigil-task-manager/LICENSE", doc = true, mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon-x11 = "*"
mesa-libEGL = "*"
